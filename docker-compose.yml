services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: cultural-storytelling-backend

    env_file:
      - ./backend/.env

    expose:
      - "8000"

    volumes:
      - backend_data:/app

    networks:
      - cultural-network

    restart: unless-stopped


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: /api

    container_name: cultural-storytelling-frontend

    expose:
      - "80"

    depends_on:
      - backend

    networks:
      - cultural-network

    restart: unless-stopped


  nginx:
    image: nginx:alpine

    container_name: cultural-storytelling-nginx

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - frontend
      - backend

    networks:
      - cultural-network

    restart: unless-stopped


networks:
  cultural-network:
    driver: bridge


volumes:
  backend_data:
